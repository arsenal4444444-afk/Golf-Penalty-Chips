<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f7a3b">
  <title>GOLF PENALTY CHIPS｜Who Pays?</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",Arial,sans-serif;color:#1f2a1f;padding:18px 14px 28px;background:linear-gradient(155deg,#72c66f 0%,#2f9a55 36%,#116436 68%,#083d25 100%)}
    .wrap{max-width:520px;margin:0 auto}
    .hero{border:1px solid rgba(255,255,255,.28);border-radius:30px;padding:22px 18px 18px;color:white;box-shadow:0 18px 50px rgba(0,0,0,.22);background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.22)),repeating-linear-gradient(120deg,rgba(255,255,255,.08) 0 22px,rgba(255,255,255,.02) 22px 44px);text-align:center}
    .kicker{font-size:12px;letter-spacing:.18em;font-weight:900;opacity:.9}
    h1{margin:8px 0 4px;font-size:31px;line-height:1.02;letter-spacing:.04em}
    .sub{margin:0;font-weight:900;color:#f3ffd0}
    .oji{width:86px;height:86px;margin:14px auto 0;border-radius:50%;background:white;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.22);font-size:45px;color:#111;position:relative}
    .oji:after{content:"ゴルチップ";position:absolute;bottom:-8px;right:-18px;background:#111;color:white;font-size:10px;padding:4px 8px;border-radius:999px;font-weight:900}
    .panel{margin-top:14px;background:rgba(255,255,255,.9);border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.6)}
    .row{display:flex;gap:10px;align-items:center}
    .field{flex:1}
    label{font-size:13px;font-weight:900;color:#314031}
    select,input{width:100%;border:1px solid rgba(31,42,31,.18);border-radius:16px;padding:13px 12px;font-size:17px;background:white;color:#1f2a1f;outline:none}
    .players{display:grid;gap:10px;margin-top:12px}
    .player{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;align-items:end;background:rgba(31,122,59,.07);border-radius:18px;padding:10px}
    .hint{font-size:12px;color:#667066;line-height:1.55;margin:10px 2px 0}
    .ball{width:100%;margin-top:16px;border:0;border-radius:999px;padding:18px 16px;background:radial-gradient(circle at 22% 28%,rgba(0,0,0,.09) 0 2px,transparent 3px),radial-gradient(circle at 42% 48%,rgba(0,0,0,.08) 0 2px,transparent 3px),radial-gradient(circle at 66% 30%,rgba(0,0,0,.08) 0 2px,transparent 3px),linear-gradient(#fff,#e9e9df);color:#12351f;font-size:20px;font-weight:1000;letter-spacing:.05em;box-shadow:0 10px 0 #d2d2c5,0 18px 30px rgba(0,0,0,.22);cursor:pter}
    .ball:active{transform:translateY(5px);box-shadow:0 5px 0 #d2d2c5,0 10px 20px rgba(0,0,0,.2)}
    .mini{display:flex;gap:8px;margin-top:10px}
    .mini button{flex:1;border:0;background:rgba(255,255,255,.8);border-radius:14px;padding:11px;font-weight:900;color:#24442a}
    .result{display:none;margin-top:14px}
    .result.show{display:block}
    .result h2{font-size:18px;margin:0 0 10px}
    .summary{background:#12351f;color:white;border-radius:18px;padding:13px 14px;margin-bottom:10px;font-weight:900;line-height:1.55}
    .pay{background:white;border-radius:16px;padding:13px 14px;margin:8px 0;font-size:17px;font-weight:900;display:flex;justify-content:space-between;gap:8px}
    .pay small{display:block;font-size:12px;color:#667066;font-weight:700;margin-top:2px}
    .empty{background:white;border-radius:16px;padding:14px;color:#667066;font-weight:900;text-align:center}
    .footer{text-align:center;color:rgba(255,255,255,.78);font-size:11px;margin:18px 0 0}
  </style>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="kicker">GOLF PENALTY CHIPS</div>
      <h1>WHO PAYS?</h1>
<p class="sub">最後に入力して一発精算</p>
<img src="images/golf-chip-niku.png" alt="ゴルフチップ" class="oji">
</section>

    <section class="panel">
      <div class="row">
        <div class="field"><label for="people">人数</label><select id="people"><option value="2">2人</option><option value="3">3人</option><option value="4" selected>4人</option><option value="5">5人</option><option value="6">6人</option></select></div>
        <div class="field"><label for="yen">1チップポイント</label><input id="yen" inputmode="numeric" type="number" min="1" step="100" value="500"></div>
      </div>
      <div id="players" class="players"></div>
      <p class="hint">ルール：全員総当たり精算。チップが多い人が、少ない人へ差額分を支払います。</p>
      <button class="ball" id="calc">精算する</button>
      <div class="mini"><button id="reset" type="button">リセット</button></div>
      <a class="buy-button" href="https://item.rakuten.co.jp/stones2004/golfpenaltychips/?l-id=shoptop_widget_featured_items" target="_blank">
  楽天で購入する
</a>
      <div id="result" class="result"></div>

    
    </section>
    <div class="footer">Laugh & Play｜GOLF PENALTY CHIPS</div>
  </main>

<script src="script.js"></script>
</body>
</html>
